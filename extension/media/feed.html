<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src %CSP%; script-src 'nonce-%NONCE%';">
<style>
  @font-face { font-family: 'Roboto Mono'; src: url('%FONT%') format('woff2'); font-weight: 100 700; font-display: swap; }

  /* ---- base: segue o tema do VS Code (skin "vscode") ---- */
  body { margin: 0; padding: 0; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-sideBar-background); }
  header { position: sticky; top: 0; z-index: 2; background: var(--vscode-sideBar-background); border-bottom: 1px solid var(--vscode-panel-border); }
  .row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; }
  #lv { flex: none; font-size: .78em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 3px; opacity: .8; cursor: default; }
  #tabs { display: flex; gap: 2px; padding: 0 6px; overflow-x: auto; scrollbar-width: none; }
  #tabs[hidden] { display: none; }
  .tab { font: inherit; font-size: .85em; white-space: nowrap; color: var(--vscode-descriptionForeground); background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 4px 8px; cursor: pointer; }
  .tab:hover { color: var(--vscode-foreground); background: transparent; }
  .tab.on { color: var(--vscode-foreground); border-bottom-color: var(--vscode-focusBorder); }
  .tab .dot { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--vscode-focusBorder); vertical-align: middle; }
  #xp { height: 2px; background: var(--vscode-panel-border); }
  #xp i { display: block; height: 100%; width: 0; background: var(--vscode-focusBorder); transition: width .6s ease-out; }
  #toast { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 6px); padding: 3px 10px; border-radius: 4px; font-size: .85em; white-space: nowrap; color: var(--vscode-button-foreground); background: var(--vscode-button-background); pointer-events: none; }
  .proj { display: none; margin-right: 6px; font-size: .74em; opacity: .7; }
  body.multi.flow .proj { display: inline; }
  #mascot { width: 46px; height: 46px; flex: none; }
  #mascot .case { fill: none; stroke: currentColor; stroke-width: 6; }
  #mascot .screen { fill: currentColor; opacity: .12; }
  #mascot text { font: 700 30px var(--vscode-editor-font-family), monospace; fill: currentColor; }
  #state { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); border: 0; padding: 2px 8px; cursor: pointer; }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  #todos { padding: 6px 10px; border-bottom: 1px solid var(--vscode-panel-border); }
  #todos div { padding: 1px 0; }
  #todos .completed { opacity: .55; text-decoration: line-through; }
  #todos .in_progress { font-weight: 600; }
  .item { padding: 6px 10px; border-bottom: 1px solid var(--vscode-panel-border); }
  .k { display: inline-block; min-width: 5.5em; margin-right: 4px; font-size: .78em; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  .sub { opacity: .65; }
  .body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  pre.body { max-height: 14em; overflow: auto; font-family: var(--vscode-editor-font-family); font-size: .9em; }
  .prompt { background: var(--vscode-editor-inactiveSelectionBackground); }
  .text .body { line-height: 1.45; }
  .thinking .body { font-style: italic; opacity: .75; }
  .wait .title { color: var(--vscode-editorWarning-foreground); }
  .fail .title { color: var(--vscode-errorForeground); }
  a { color: var(--vscode-textLink-foreground); cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hits { margin-top: 4px; max-height: 14em; overflow: auto; }
  .hits a { display: block; font-family: var(--vscode-editor-font-family); font-size: .9em; }
  #empty { padding: 12px 10px; opacity: .65; }

  /* ---- skin "vaporwave": preto fundo, neon com brilho, ainda com cara de IDE ---- */
  .vw {
    --bg: #050507; --panel: #0c0a14; --line: #1d1830; --fg: #ece7ff; --dim: #9389b8;
    --pink: #ff4fd8; --cyan: #4ff0ff; --mint: #7cf5c8; --violet: #b98cff; --peach: #ffb86b; --red: #ff5c7a;
    --glow: 0 0 6px currentColor, 0 0 14px color-mix(in srgb, currentColor 45%, transparent);
    --mono: 'Roboto Mono', var(--vscode-editor-font-family), monospace;
    background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: calc(var(--vscode-font-size) * .95);
  }
  .vw pre.body, .vw .hits a, .vw #mascot text { font-family: var(--mono); }
  .vw header { background: rgba(5, 5, 7, .92); border-bottom: 0; backdrop-filter: blur(6px); }
  /* linha do horizonte = barra de XP: o trilho apagado, a parte ganha em neon rosa -> ciano */
  .vw #xp { height: 2px; background: #1d1830; }
  .vw #xp i { background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); box-shadow: 0 0 8px var(--pink), 0 0 14px rgba(79, 240, 255, .5); }
  .vw #lv { color: var(--mint); opacity: 1; text-shadow: var(--glow); border-color: color-mix(in srgb, var(--mint) 45%, transparent); }
  .vw .tab { color: var(--dim); border: 0; border-bottom: 2px solid transparent; border-radius: 0; box-shadow: none; }
  .vw .tab:hover { color: var(--fg); background: transparent; box-shadow: none; }
  .vw .tab.on { color: var(--cyan); text-shadow: var(--glow); border-bottom-color: var(--pink); }
  .vw .tab .dot { background: var(--pink); box-shadow: 0 0 6px var(--pink); }
  .vw #toast { color: var(--bg); background: var(--mint); box-shadow: 0 0 14px rgba(124, 245, 200, .7); font-weight: 600; }
  .vw .proj { color: var(--violet); opacity: 1; }
  #toast[hidden] { display: none; }
  .levelup #mascot { animation: levelup .9s ease-out; }
  @keyframes levelup { 30% { transform: translateY(-6px) scale(1.12); } 60% { transform: translateY(1px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { .levelup #mascot { animation: none; } }
  .vw #mascot { color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
  .vw #mascot text { fill: var(--cyan); }
  .vw #mascot .screen { fill: #000; opacity: 1; }
  .vw #state { color: var(--cyan); text-shadow: var(--glow); font-size: .92em; letter-spacing: .02em; }
  .vw button { color: var(--pink); background: transparent; border: 1px solid color-mix(in srgb, var(--pink) 55%, transparent); border-radius: 4px; }
  .vw button:hover { background: rgba(255, 79, 216, .12); box-shadow: 0 0 10px rgba(255, 79, 216, .45); }
  .vw button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  .vw #todos { border-bottom: 1px solid var(--line); background: var(--panel); }
  .vw #todos .in_progress { color: var(--mint); text-shadow: var(--glow); font-weight: 600; }
  .vw #todos .completed { color: var(--dim); }
  .vw .item { border-bottom: 1px solid var(--line); }
  .vw .k { opacity: 1; text-shadow: var(--glow); font-size: .74em; }
  .vw .title { color: var(--fg); }
  .vw :is(.read, .edit, .search, .hits, .bash) .title { font-size: .92em; }
  .vw .sub { color: var(--dim); opacity: 1; }
  .vw pre.body { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: #d9d2ff; }
  .vw .prompt { background: linear-gradient(90deg, rgba(255, 79, 216, .10), transparent 70%); }
  .vw .prompt .body::before { content: '❯ '; color: var(--pink); text-shadow: var(--glow); }
  .vw .thinking .body { color: var(--dim); }
  .vw a { color: var(--cyan); }
  .vw a:hover { text-shadow: var(--glow); text-decoration: none; }
  .vw .hits a { color: var(--mint); }
  .vw #empty { color: var(--dim); opacity: 1; }
  .vw .prompt .k, .vw .edit .k { color: var(--pink); }
  .vw .text .k, .vw .plan .k { color: var(--violet); }
  .vw .read .k, .vw .agent .k, .vw .web .k { color: var(--cyan); }
  .vw .search .k, .vw .hits .k, .vw .stop .k { color: var(--mint); }
  .vw .bash .k, .vw .wait .k { color: var(--peach); }
  .vw .output .k, .vw .tool .k, .vw .thinking .k { color: var(--dim); text-shadow: none; }
  .vw .fail .k, .vw .fail .title { color: var(--red); }
  .vw .item.fresh { animation: tune-in .5s ease-out; }
  @keyframes tune-in { from { opacity: 0; transform: translateY(4px); background: rgba(79, 240, 255, .08); } }
  @media (prefers-reduced-motion: reduce) { .vw .item.fresh { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <svg id="mascot" viewBox="0 0 128 128" aria-hidden="true">
      <path class="case" d="M50 30 38 10M78 30l12-20"/>
      <rect class="case" x="10" y="30" width="108" height="80" rx="18"/>
      <rect class="screen" x="22" y="42" width="84" height="56" rx="10"/>
      <text id="face" x="64" y="79" text-anchor="middle">T_T</text>
    </svg>
    <span id="state"></span><span id="lv">lv 1</span><button id="pause"></button>
  </div>
  <nav id="tabs" hidden></nav>
  <div id="xp"><i></i></div>
  <div id="toast" role="status" hidden></div>
</header>
<div id="todos" hidden></div>
<div id="empty"></div>
<div id="feed"></div>
<script nonce="%NONCE%">
  const vscode = acquireVsCodeApi();
  const MAX = 400; // mesmo limite do feed na extensão
  let UI = { labels: {}, empty: '', pause: 'Pause', resume: 'Resume' }; // textos chegam da extensão no idioma escolhido
  let isPaused = false;
  let following = 'flow', projects = [];
  const unread = new Set(); // projetos com passo novo que a aba seguida não mostrou
  const LEVELUP_MS = 2600;  // quanto o aviso e a cara de comemoração ficam na tela
  // A cara do mascote acompanha o último passo.
  const FACE = { prompt: '•_•', text: '•‿•', thinking: '-_-', read: 'o_o', search: 'O_O', hits: '^o^', bash: '>_>', output: 'o_o', edit: '>_<', plan: '•_•', agent: '◉_◉', web: 'O_O', wait: '?_?', fail: 'T_T', stop: '^_^', tool: 'o_o' };
  const $ = (id) => document.getElementById(id);
  const feedEl = $('feed'), todosEl = $('todos');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const open = (file, line) => vscode.postMessage({ type: 'open', file, line });

  function render(it) {
    const d = el('div', 'item ' + it.kind);
    d.dataset.project = it.project || '';
    const head = el('div');
    if (it.projectName) head.append(el('span', 'proj', it.projectName));
    head.append(el('span', 'k', (it.agent ? 'sub · ' : '') + (UI.labels[it.kind] || it.kind)));
    const title = el(it.file ? 'a' : 'span', 'title', it.title || '');
    if (it.file) title.onclick = () => open(it.file, it.line || 1);
    head.append(title);
    if (it.sub) head.append(el('span', 'sub', ' · ' + it.sub));
    d.append(head);
    if (it.body) d.append(el(it.code ? 'pre' : 'div', 'body', it.body));
    if (it.hits && it.hits.length) {
      const h = el('div', 'hits');
      for (const x of it.hits) {
        const a = el('a', '', `${x.rel}:${x.line}`);
        a.onclick = () => open(x.file, x.line);
        h.append(a);
      }
      d.append(h);
    }
    return d;
  }

  // Só rola sozinho se a pessoa já está no fim; se subiu para reler, não puxa de volta.
  let stick = true;
  addEventListener('scroll', () => { stick = innerHeight + scrollY >= document.body.scrollHeight - 40; });
  const shows = (project) => following === 'flow' || following === (project || '');
  function add(it, fresh) {
    $('empty').hidden = true;
    const d = render(it);
    d.hidden = !shows(it.project);
    if (fresh) d.classList.add('fresh');
    feedEl.append(d);
    while (feedEl.children.length > MAX) feedEl.firstChild.remove();
    if (d.hidden) {
      if (fresh && !unread.has(it.project)) { unread.add(it.project); renderTabs(); }
      return;
    }
    if (stick) scrollTo(0, document.body.scrollHeight);
    if (!celebrating) $('face').textContent = FACE[it.kind] || 'o_o';
  }

  // ---------- abas ----------
  function renderTabs() {
    const nav = $('tabs');
    nav.textContent = '';
    nav.hidden = projects.length === 0;
    document.body.classList.toggle('multi', projects.length > 1);
    document.body.classList.toggle('flow', following === 'flow');
    for (const p of [{ key: 'flow', name: UI.flow, tip: UI.flowTip }, ...projects]) {
      const b = el('button', 'tab' + (following === p.key ? ' on' : ''), p.name);
      b.title = p.tip || p.key;
      if (p.key !== 'flow' && unread.has(p.key)) b.append(el('span', 'dot'));
      b.onclick = () => vscode.postMessage({ type: 'follow', project: p.key });
      nav.append(b);
    }
  }
  function setFollowing(f) {
    following = f;
    unread.delete(f);
    if (f === 'flow') unread.clear();
    for (const d of feedEl.children) d.hidden = !shows(d.dataset.project);
    renderTabs();
    scrollTo(0, document.body.scrollHeight);
  }

  // ---------- nível ----------
  let celebrating = false;
  function setXp(x) {
    $('lv').textContent = `lv ${x.level}`;
    $('lv').title = x.tip;
    $('xp').firstElementChild.style.width = `${Math.round(x.progress * 1000) / 10}%`;
  }
  function levelUp(level) {
    const t = $('toast');
    t.textContent = `★ ${UI.levelUp} lv ${level}`;
    t.hidden = false;
    celebrating = true;
    $('face').textContent = '★_★';
    document.body.classList.add('levelup');
    setTimeout(() => { t.hidden = true; celebrating = false; document.body.classList.remove('levelup'); }, LEVELUP_MS);
  }
  function showTodos(list) {
    todosEl.textContent = '';
    todosEl.hidden = !list || !list.length;
    const mark = { completed: '✓', in_progress: '▸', pending: '·' };
    for (const t of list || []) todosEl.append(el('div', t.status, `${mark[t.status] || '·'} ${t.content}`));
  }
  const setPaused = (p) => { isPaused = p; $('pause').textContent = p ? UI.resume : UI.pause; };
  function setUi(ui) {
    UI = ui;
    $('empty').textContent = ui.empty;
    setPaused(isPaused);
    renderTabs();
  }
  const setSkin = (s) => document.body.classList.toggle('vw', s !== 'vscode');

  addEventListener('message', ({ data: m }) => {
    if (m.type === 'ui') setUi(m.ui);
    if (m.type === 'projects') { projects = m.projects; renderTabs(); }
    if (m.type === 'following') setFollowing(m.following);
    if (m.type === 'xp') setXp(m.xp);
    if (m.type === 'levelup') levelUp(m.level);
    if (m.type === 'init') { following = m.following; projects = m.projects; setXp(m.xp); setSkin(m.skin); setUi(m.ui); renderTabs(); feedEl.textContent = ''; m.feed.forEach((it) => add(it, false)); showTodos(m.todos); setPaused(m.paused); $('state').textContent = m.state; }
    if (m.type === 'add') add(m.item, true);
    if (m.type === 'todos') showTodos(m.todos);
    if (m.type === 'state') $('state').textContent = m.state;
    if (m.type === 'paused') setPaused(m.paused);
    if (m.type === 'skin') setSkin(m.skin);
  });
  $('pause').onclick = () => vscode.postMessage({ type: 'toggle' });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
