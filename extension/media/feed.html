<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src %CSP%; script-src 'nonce-%NONCE%';">
<style>
  @font-face { font-family: 'Roboto Mono'; src: url('%FONT%') format('woff2'); font-weight: 100 700; font-display: swap; }

  /* ---- base: segue o tema do VS Code (skin "vscode") ---- */
  body { margin: 0; padding: 0; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-sideBar-background); }
  #stage { position: sticky; top: 0; z-index: 2; display: grid; justify-items: center; gap: 4px; padding: 14px 10px 10px; background: var(--vscode-sideBar-background); border-bottom: 1px solid var(--vscode-panel-border); }
  #botwrap { position: relative; width: 84px; height: 84px; }
  #bot { width: 84px; height: 84px; overflow: visible; color: var(--vscode-foreground); }
  #bot .case { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
  #bot .screen { fill: currentColor; opacity: .12; }
  #bot .bulb { fill: currentColor; }
  #bot text { font: 700 30px 'Roboto Mono', var(--vscode-editor-font-family), monospace; fill: currentColor; }
  #bot .tear { fill: #6cb6ff; opacity: 0; }
  #bubble { position: absolute; top: -2px; right: -30px; display: none; gap: 3px; padding: 5px 7px; border-radius: 10px; border: 1px solid currentColor; color: var(--vscode-descriptionForeground); }
  #bubble i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  #state { max-width: 100%; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9em; opacity: .75; }
  #pause { position: absolute; top: 8px; right: 8px; font: inherit; font-size: .85em; color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); border: 0; padding: 2px 7px; cursor: pointer; }
  #pause:hover { background: var(--vscode-button-secondaryHoverBackground); }
  #todos { padding: 6px 10px; border-bottom: 1px solid var(--vscode-panel-border); }
  #todos div { padding: 1px 0; }
  #todos .completed { opacity: .55; text-decoration: line-through; }
  #todos .in_progress { font-weight: 600; }
  .item { padding: 6px 10px; border-bottom: 1px solid var(--vscode-panel-border); }
  .k { display: inline-block; min-width: 5.5em; margin-right: 4px; font-size: .78em; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  .sub { opacity: .65; }
  .body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  pre.body { max-height: 14em; overflow: auto; font-family: var(--vscode-editor-font-family); font-size: .9em; }
  .prompt { background: var(--vscode-editor-inactiveSelectionBackground); }
  .text .body { line-height: 1.45; }
  .thinking .body { font-style: italic; opacity: .75; }
  .wait .title { color: var(--vscode-editorWarning-foreground); }
  .fail .title { color: var(--vscode-errorForeground); }
  a { color: var(--vscode-textLink-foreground); cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hits { margin-top: 4px; max-height: 14em; overflow: auto; }
  .hits a { display: block; font-family: var(--vscode-editor-font-family); font-size: .9em; }
  #empty { padding: 12px 10px; opacity: .65; text-align: center; }

  /* ---- o robô: um estado por vez no #stage (idle, thinking, working, done, fail) ---- */
  #bot { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  .thinking #bot { animation: ponder 2.4s ease-in-out infinite; }
  .thinking #bubble { display: flex; }
  .thinking #bubble i { animation: dot 1.2s ease-in-out infinite; }
  .thinking #bubble i:nth-child(2) { animation-delay: .15s; }
  .thinking #bubble i:nth-child(3) { animation-delay: .3s; }
  .thinking .b1 { animation: bulb 1.2s ease-in-out infinite; }
  .thinking .b2 { animation: bulb 1.2s ease-in-out .6s infinite; }
  .working #bot { animation: bob .7s ease-in-out infinite; }
  .working .bulb { animation: bulb .5s ease-in-out infinite; }
  .working .screen { animation: flicker .9s steps(2) infinite; }
  .idle #state { visibility: hidden; } /* parado, o robô fala por si: sem legenda */
  .done #bot { animation: hop .55s ease-out 2; }
  .fail #bot { animation: none; }
  .fail .tear { animation: tear 1.6s ease-in infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes ponder { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2px); } }
  @keyframes hop { 40% { transform: translateY(-9px); } 70% { transform: translateY(1px); } }
  @keyframes bulb { 50% { opacity: .25; } }
  @keyframes dot { 50% { transform: translateY(-3px); opacity: .4; } }
  @keyframes flicker { 50% { opacity: .82; } }
  @keyframes tear { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(18px); } }
  @media (prefers-reduced-motion: reduce) { #bot, #bot *, #bubble i, .item.fresh { animation: none !important; } }

  /* ---- skin "vaporwave": preto fundo, roxo com brilho, Roboto Mono, ainda com cara de IDE ---- */
  .vw {
    --bg: #050507; --panel: #0d0b16; --line: #1e1a33; --fg: #ece7ff; --dim: #948ab8;
    --violet: #b18cff; --purple: #8b5cf6; --lav: #d4c4ff; --orchid: #e07bff;
    --cyan: #5ee7ff; --mint: #7cf5c8; --peach: #ffb86b; --red: #ff6b88;
    --glow: 0 0 6px currentColor, 0 0 14px color-mix(in srgb, currentColor 40%, transparent);
    background: var(--bg); color: var(--fg);
    font-family: 'Roboto Mono', var(--vscode-editor-font-family), monospace; font-size: calc(var(--vscode-font-size) * .95);
  }
  .vw pre.body, .vw .hits a, .vw #bot text { font-family: 'Roboto Mono', var(--vscode-editor-font-family), monospace; }
  .vw #stage { background: rgba(5, 5, 7, .94); border-bottom: 0; backdrop-filter: blur(6px); }
  .vw #stage::after { /* linha do horizonte roxa */
    content: ''; position: absolute; inset: auto 0 0 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--purple), var(--violet), var(--purple), transparent);
    box-shadow: 0 0 10px var(--purple);
  }
  .vw #bot { color: var(--violet); filter: drop-shadow(0 0 6px rgba(139, 92, 246, .8)); }
  .vw #bot .screen { fill: #000; opacity: 1; }
  .vw #bot text { fill: var(--lav); }
  .vw #bot .bulb { fill: var(--cyan); }
  .vw #bot .tear { fill: var(--cyan); }
  .vw #bubble { color: var(--violet); background: var(--panel); box-shadow: 0 0 8px rgba(139, 92, 246, .5); }
  .vw .working #bot { filter: drop-shadow(0 0 9px rgba(177, 140, 255, .95)); }
  .vw .fail #bot { color: var(--red); filter: drop-shadow(0 0 6px rgba(255, 107, 136, .6)); }
  .vw #state { color: var(--violet); opacity: 1; text-shadow: 0 0 8px rgba(139, 92, 246, .6); }
  .vw #pause { color: var(--violet); background: transparent; border: 1px solid color-mix(in srgb, var(--violet) 45%, transparent); border-radius: 4px; }
  .vw #pause:hover { background: rgba(139, 92, 246, .15); box-shadow: 0 0 10px rgba(139, 92, 246, .45); }
  .vw #pause:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  .vw #todos { border-bottom: 1px solid var(--line); background: var(--panel); }
  .vw #todos .in_progress { color: var(--lav); text-shadow: var(--glow); font-weight: 600; }
  .vw #todos .completed { color: var(--dim); }
  .vw .item { border-bottom: 1px solid var(--line); }
  .vw .k { opacity: 1; text-shadow: var(--glow); font-size: .74em; }
  .vw .title { color: var(--fg); }
  .vw .sub { color: var(--dim); opacity: 1; }
  .vw pre.body { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: #d9d2ff; }
  .vw .prompt { background: linear-gradient(90deg, rgba(139, 92, 246, .14), transparent 70%); }
  .vw .prompt .body::before { content: '❯ '; color: var(--violet); text-shadow: var(--glow); }
  .vw .thinking .body { color: var(--dim); }
  .vw a { color: var(--lav); }
  .vw a:hover { text-shadow: var(--glow); text-decoration: none; }
  .vw .hits a { color: var(--mint); }
  .vw #empty { color: var(--dim); opacity: 1; }
  .vw .prompt .k, .vw .text .k, .vw .plan .k { color: var(--violet); }
  .vw .edit .k { color: var(--orchid); }
  .vw .read .k, .vw .agent .k, .vw .web .k { color: var(--cyan); }
  .vw .search .k, .vw .hits .k, .vw .stop .k { color: var(--mint); }
  .vw .bash .k, .vw .wait .k { color: var(--peach); }
  .vw .output .k, .vw .tool .k, .vw .thinking .k { color: var(--dim); text-shadow: none; }
  .vw .fail .k, .vw .fail .title { color: var(--red); }
  .vw .item.fresh { animation: tune-in .5s ease-out; }
  @keyframes tune-in { from { opacity: 0; transform: translateY(4px); background: rgba(139, 92, 246, .1); } }
</style>
</head>
<body>
<header id="stage" class="idle">
  <button id="pause" title="Pausar" aria-label="Pausar">❚❚</button>
  <div id="botwrap">
    <svg id="bot" viewBox="0 0 128 128" aria-hidden="true">
      <path class="case" d="M50 30 38 12M78 30l12-18"/>
      <circle class="bulb b1" cx="38" cy="11" r="6"/>
      <circle class="bulb b2" cx="90" cy="11" r="6"/>
      <rect class="case" x="10" y="30" width="108" height="80" rx="18"/>
      <rect class="screen" x="22" y="42" width="84" height="56" rx="10"/>
      <text id="face" x="64" y="79" text-anchor="middle">•_•</text>
      <path class="tear" d="M46 84c0 3-2 5-4 5s-4-2-4-5 4-8 4-8 4 5 4 8z"/>
    </svg>
    <div id="bubble" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="state" role="status"></div>
</header>
<div id="todos" hidden></div>
<div id="empty"></div>
<div id="feed"></div>
<script nonce="%NONCE%">
  const vscode = acquireVsCodeApi();
  const MAX = 400; // mesmo limite do feed na extensão
  let UI = { labels: {}, empty: '', pause: 'Pause', resume: 'Resume' }; // textos chegam da extensão no idioma escolhido
  let isPaused = false;
  // Cara do robô enquanto trabalha, pelo tipo do passo.
  const FACE = { read: 'o_o', search: 'O_O', hits: '^o^', bash: '>_>', output: 'o_o', edit: '>_<', plan: '•_•', agent: '◉_◉', web: 'O_O', tool: 'o_o', wait: '?_?' };
  const ACTIONS = new Set(Object.keys(FACE));
  const THINK_AFTER_MS = 1600; // sem passo novo por esse tempo, com o turno aberto: a IA está pensando
  const DONE_MS = 4000, FAIL_MS = 2500; // quanto a cara de "terminou" / "deu erro" fica antes de voltar
  const $ = (id) => document.getElementById(id);
  const feedEl = $('feed'), todosEl = $('todos'), stage = $('stage'), faceEl = $('face');

  // ---------- robô ----------
  let mode = 'idle', face = '•_•', active = false, settle = 0;
  function setMode(m, f) {
    mode = m; face = f;
    stage.className = m;
    faceEl.textContent = f;
  }
  function later(ms, fn) { clearTimeout(settle); settle = setTimeout(fn, ms); }
  const rest = () => (active ? setMode('thinking', '•_•') : setMode('idle', '•_•'));

  function react(it) {
    const k = it.kind;
    if (it.end) { // fim do turno: comemora ou chora, depois descansa
      active = false;
      if (k === 'stop') { setMode('done', '^_^'); later(DONE_MS, rest); } else { setMode('fail', 'T_T'); later(DONE_MS, rest); }
      return;
    }
    active = true;
    if (k === 'prompt' || k === 'thinking') { clearTimeout(settle); return setMode('thinking', '•_•'); }
    if (k === 'text') { setMode('working', '•‿•'); return later(THINK_AFTER_MS, rest); }
    if (k === 'fail') { setMode('fail', 'T_T'); return later(FAIL_MS, rest); }
    if (k === 'wait') { clearTimeout(settle); return setMode('thinking', '?_?'); }
    if (ACTIONS.has(k)) { setMode('working', FACE[k]); later(THINK_AFTER_MS, rest); }
  }

  // Piscada de vez em quando, só parado ou pensando (trabalhando, a cara é do passo).
  (function blink() {
    setTimeout(() => {
      if ((mode === 'idle' || mode === 'thinking') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        faceEl.textContent = '-_-';
        setTimeout(() => { faceEl.textContent = face; }, 140);
      }
      blink();
    }, 2800 + Math.random() * 2600);
  })();

  // ---------- feed ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const open = (file, line) => vscode.postMessage({ type: 'open', file, line });

  function render(it) {
    const d = el('div', 'item ' + it.kind);
    const head = el('div');
    head.append(el('span', 'k', (it.agent ? 'sub · ' : '') + (UI.labels[it.kind] || it.kind)));
    const title = el(it.file ? 'a' : 'span', 'title', it.title || '');
    if (it.file) title.onclick = () => open(it.file, it.line || 1);
    head.append(title);
    if (it.sub) head.append(el('span', 'sub', ' · ' + it.sub));
    d.append(head);
    if (it.body) d.append(el(it.code ? 'pre' : 'div', 'body', it.body));
    if (it.hits && it.hits.length) {
      const h = el('div', 'hits');
      for (const x of it.hits) {
        const a = el('a', '', `${x.rel}:${x.line}`);
        a.onclick = () => open(x.file, x.line);
        h.append(a);
      }
      d.append(h);
    }
    return d;
  }

  // Só rola sozinho se a pessoa já está no fim; se subiu para reler, não puxa de volta.
  let stick = true;
  addEventListener('scroll', () => { stick = innerHeight + scrollY >= document.body.scrollHeight - 40; });
  function add(it, fresh) {
    $('empty').hidden = true;
    const d = render(it);
    if (fresh) { d.classList.add('fresh'); react(it); }
    feedEl.append(d);
    while (feedEl.children.length > MAX) feedEl.firstChild.remove();
    if (stick) scrollTo(0, document.body.scrollHeight);
  }
  function showTodos(list) {
    todosEl.textContent = '';
    todosEl.hidden = !list || !list.length;
    const mark = { completed: '✓', in_progress: '▸', pending: '·' };
    for (const t of list || []) todosEl.append(el('div', t.status, `${mark[t.status] || '·'} ${t.content}`));
  }
  function setPaused(p) {
    isPaused = p;
    const b = $('pause');
    b.textContent = p ? '▶' : '❚❚';
    b.title = b.ariaLabel = p ? UI.resume : UI.pause;
  }
  function setUi(ui) {
    UI = ui;
    $('empty').textContent = ui.empty;
    setPaused(isPaused);
  }
  const setSkin = (s) => document.body.classList.toggle('vw', s !== 'vscode');

  addEventListener('message', ({ data: m }) => {
    if (m.type === 'init') { setSkin(m.skin); setUi(m.ui); feedEl.textContent = ''; m.feed.forEach((it) => add(it, false)); showTodos(m.todos); setPaused(m.paused); $('state').textContent = m.state; }
    if (m.type === 'ui') setUi(m.ui);
    if (m.type === 'add') add(m.item, true);
    if (m.type === 'todos') showTodos(m.todos);
    if (m.type === 'state') $('state').textContent = m.state;
    if (m.type === 'paused') setPaused(m.paused);
    if (m.type === 'skin') setSkin(m.skin);
  });
  $('pause').onclick = () => vscode.postMessage({ type: 'toggle' });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
