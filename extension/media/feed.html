<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src %CSP%; script-src 'nonce-%NONCE%';">
<style>
  @font-face { font-family: 'Roboto Mono'; src: url('%FONT%') format('woff2'); font-weight: 100 700; font-display: swap; }

  /* ---- base: segue o tema do VS Code (skin "vscode") ---- */
  body { margin: 0; padding: 0; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-sideBar-background); }
  header { position: sticky; top: 0; z-index: 2; background: var(--vscode-sideBar-background); }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 10px 8px; }
  #upd-row { padding: 0 10px 8px; }
  #upd-row:has(#upd[hidden]) { display: none; }
  .line { display: flex; gap: 8px; align-items: center; min-width: 0; }
  #level { position: relative; cursor: default; }
  #level::before { content: ''; position: absolute; inset: -5px 0 0; } /* área de hover maior que a barra fina */
  #lv { flex: none; display: inline-flex; align-items: baseline; gap: 4px; padding: 1px 7px; border: 1px solid currentColor; border-radius: 4px; line-height: 1.25; }
  #lv b { font-size: .62em; letter-spacing: .1em; opacity: .75; }
  #lvn { font-weight: 700; font-variant-numeric: tabular-nums; }
  #tabs { display: flex; gap: 2px; padding: 0 6px; overflow-x: auto; scrollbar-width: none; }
  #tabs[hidden] { display: none; }
  .tab { font: inherit; font-size: .85em; white-space: nowrap; color: var(--vscode-descriptionForeground); background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 4px 8px; cursor: pointer; }
  .tab:hover { color: var(--vscode-foreground); background: transparent; }
  .tab.on { color: var(--vscode-foreground); border-bottom-color: var(--vscode-focusBorder); }
  .tab .dot { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--vscode-focusBorder); vertical-align: middle; }
  #xp { position: relative; flex: 1; min-width: 40px; height: 3px; border-radius: 0; background: var(--vscode-panel-border); overflow: hidden; }
  #xp i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--vscode-focusBorder); overflow: hidden; transition: width .6s ease-out; }
  #xp i::after { /* reflexo que passa quando ganha XP */
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .6), transparent);
  }
  #xp.gain i::after { animation: shimmer .9s ease-out; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { #xp.gain i::after { animation: none; } #xp i { transition: none; } }
  #upd { flex: none; align-self: flex-start; justify-self: start; width: max-content; margin: 4px 0 0; padding: 1px 8px; border-radius: 10px; font: inherit; font-size: .72em; cursor: pointer; border: 1px solid currentColor; color: var(--vscode-button-foreground); background: var(--vscode-button-background); animation: pulse 1.8s ease-in-out infinite; }
  #upd[hidden] { display: none; }
  #upd[data-kind=outdated] { color: #1a1300; background: #ffb454; }
  .vw #upd[data-kind=outdated] { color: var(--bg); background: var(--peach); box-shadow: 0 0 12px rgba(255, 180, 84, .6); }
  .vw #upd { color: var(--bg); background: var(--mint); border-color: transparent; box-shadow: 0 0 12px rgba(124, 245, 200, .7); font-weight: 600; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { #upd { animation: none; } }
  #toast { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 6px); padding: 3px 10px; border-radius: 4px; font-size: .85em; white-space: nowrap; color: var(--vscode-button-foreground); background: var(--vscode-button-background); pointer-events: none; }
  .proj { display: none; margin-right: 6px; font-size: .74em; opacity: .7; }
  body.multi.flow .proj { display: inline; }
  #mascot { width: 54px; height: 54px; flex: none; }
  #mascot .case { fill: none; stroke: currentColor; stroke-width: 6; }
  #mascot .screen { fill: currentColor; opacity: .12; }
  #mascot text { font: 700 30px var(--vscode-editor-font-family), monospace; fill: currentColor; }
  #state { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); border: 0; padding: 2px 8px; cursor: pointer; }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  #todos { padding: 6px 10px; border-bottom: 1px solid var(--vscode-panel-border); }
  #todos div { padding: 1px 0; }
  #todos .completed { opacity: .55; text-decoration: line-through; }
  #todos .in_progress { font-weight: 600; }
  .item { padding: 6px 10px; border-bottom: 1px solid var(--vscode-panel-border); overflow-wrap: anywhere; } /* caminho longo sem espaço quebra a linha em vez de alargar o painel */
  .k { display: inline-block; min-width: 5.5em; margin-right: 4px; font-size: .78em; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  .sub { opacity: .65; }
  .body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  pre.body { max-height: 14em; overflow: auto; font-family: var(--vscode-editor-font-family); font-size: .9em; }
  .prompt { background: var(--vscode-editor-inactiveSelectionBackground); }
  .text .body { line-height: 1.45; }
  .thinking .body { font-style: italic; opacity: .75; }
  .wait .title { color: var(--vscode-editorWarning-foreground); }
  .fail .title { color: var(--vscode-errorForeground); }
  a { color: var(--vscode-textLink-foreground); cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hits { margin-top: 4px; max-height: 14em; overflow: auto; }
  .hits a { display: block; font-family: var(--vscode-editor-font-family); font-size: .9em; }
  #empty { padding: 12px 10px; opacity: .65; }
  #state.fail { color: var(--vscode-errorForeground); }
  .item.fail { border-left: 3px solid var(--vscode-errorForeground); }
  .tab .n { margin-left: 5px; font-size: .9em; opacity: .6; }
  details.fold summary { margin-top: 4px; cursor: pointer; list-style: none; font-size: .85em; opacity: .8; }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::before { content: '▸ '; }
  details.fold[open] summary::before { content: '▾ '; }
  .diff .add { color: var(--vscode-gitDecoration-addedResourceForeground, #3fb950); }
  .diff .del { color: var(--vscode-gitDecoration-deletedResourceForeground, #f85149); }

  /* ---- rodapé fixo: nível, XP e o jogo (secundário, dá para esconder) ---- */
  #arcade { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--vscode-sideBar-background); border-top: 1px solid var(--vscode-panel-border); }
  #arcade #level { gap: 6px; padding: 7px 10px 6px; font-size: .78em; }
  #arcade #lv { gap: 3px; padding: 0; border: 0; }
  #pct { opacity: .7; font-variant-numeric: tabular-nums; }
  #strip { position: relative; line-height: 0; }
  #game { width: 100%; aspect-ratio: 240 / 60; image-rendering: pixelated; display: block; }
  #gtoast { position: absolute; right: 6px; top: 4px; max-width: 80%; padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .75em; line-height: 1.5; color: #f0d040; background: rgba(0, 0, 0, .8); pointer-events: none; }
  #gtoast[hidden] { display: none; }
  #abar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 6px 10px 7px; font-size: .82em; font-variant-numeric: tabular-nums; }
  #abar b { font-weight: 600; }
  #gFoe { flex: 1 1 8em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .lnk { padding: 1px 4px; border: 0; background: transparent; color: var(--vscode-textLink-foreground); font-size: inherit; }
  #arcade.off #strip, #arcade.off .g { display: none; }

  /* ---- canal de previsão: a TV muda de canal quando o Claude fica parado (só com botTv.weatherCity) ---- */
  #ws { position: fixed; left: 0; right: 0; z-index: 1; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; cursor: pointer; color: #fff; font-family: var(--vscode-editor-font-family), monospace; background: linear-gradient(180deg, #0a1050, #1c2a8c 55%, #3a2a8c); }
  #ws[hidden] { display: none; }
  .ws-top { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; font-size: .85em; font-weight: 700; letter-spacing: .08em; text-shadow: 1px 1px 0 #000; background: linear-gradient(90deg, #e8862a, #c05a18); }
  .ws-body { display: grid; align-content: start; gap: 12px; padding: 12px 10px; }
  .ws-now { display: flex; align-items: center; gap: 12px; }
  #wsTemp { font-size: 2.4em; font-weight: 700; line-height: 1; color: #f0d040; text-shadow: 2px 2px 0 #000; }
  #wsCond { font-weight: 700; letter-spacing: .06em; text-shadow: 1px 1px 0 #000; }
  #wsCond small { display: block; font-weight: 400; letter-spacing: 0; color: #b8c4ff; }
  #wsDays { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
  #wsDays div { min-width: 0; padding: 4px 2px; border: 1px solid #4a5ad0; background: rgba(10, 16, 80, .65); }
  #wsDays b { display: block; font-size: .75em; color: #f0d040; }
  #wsDays i { display: block; font-size: 1.3em; font-style: normal; }
  .ws-crawl { overflow: hidden; padding: 4px 0; white-space: nowrap; font-size: .85em; border-top: 2px solid #e8862a; background: rgba(0, 0, 0, .6); }
  #wsCrawl { display: inline-block; padding-left: 100%; animation: crawl 28s linear infinite; }
  @keyframes crawl { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { #wsCrawl { padding-left: 10px; animation: none; } }

  /* ---- skin "vaporwave": preto fundo, neon com brilho, ainda com cara de IDE ---- */
  .vw {
    --bg: #050507; --panel: #0c0a14; --line: #1d1830; --fg: #ece7ff; --dim: #9389b8;
    --pink: #ff4fd8; --cyan: #4ff0ff; --mint: #7cf5c8; --violet: #b98cff; --peach: #ffb86b; --red: #ff5c7a;
    --glow: 0 0 6px currentColor, 0 0 14px color-mix(in srgb, currentColor 45%, transparent);
    --mono: 'Roboto Mono', var(--vscode-editor-font-family), monospace;
    background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: calc(var(--vscode-font-size) * .95);
  }
  .vw pre.body, .vw .hits a, .vw #mascot text { font-family: var(--mono); }
  .vw header { background: rgba(5, 5, 7, .92); backdrop-filter: blur(6px); }
  .vw #xp { background: #1d1736; overflow: visible; }
  .vw #xp i { background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); box-shadow: 0 0 8px rgba(255, 79, 216, .7), 0 0 14px rgba(79, 240, 255, .35); }
  /* selo de nível: borda em degradê rosa -> ciano, número verde-água brilhando */
  .vw #lv { color: var(--mint); border-color: transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(90deg, var(--pink), var(--cyan)) border-box; box-shadow: 0 0 10px rgba(255, 79, 216, .3); }
  .vw #lv b { color: var(--pink); opacity: 1; text-shadow: 0 0 6px rgba(255, 79, 216, .6); }
  .vw #lvn { text-shadow: var(--glow); }
  .vw .tab { color: var(--dim); border: 0; border-bottom: 2px solid transparent; border-radius: 0; box-shadow: none; }
  .vw .tab:hover { color: var(--fg); background: transparent; box-shadow: none; }
  .vw .tab.on { color: var(--cyan); text-shadow: var(--glow); border-bottom-color: var(--pink); }
  .vw .tab .dot { background: var(--pink); box-shadow: 0 0 6px var(--pink); }
  .vw #toast { color: var(--bg); background: var(--mint); box-shadow: 0 0 14px rgba(124, 245, 200, .7); font-weight: 600; }
  .vw .proj { color: var(--violet); opacity: 1; }
  #toast[hidden] { display: none; }
  .levelup #mascot { animation: levelup .9s ease-out; }
  @keyframes levelup { 30% { transform: translateY(-6px) scale(1.12); } 60% { transform: translateY(1px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { .levelup #mascot { animation: none; } }
  .vw #mascot { color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
  .vw #mascot text { fill: var(--cyan); }
  .vw #mascot .screen { fill: #000; opacity: 1; }
  .vw #state { color: var(--cyan); text-shadow: var(--glow); font-size: .92em; letter-spacing: .02em; }
  .vw button { color: var(--pink); background: transparent; border: 1px solid color-mix(in srgb, var(--pink) 55%, transparent); border-radius: 4px; }
  .vw button:hover { background: rgba(255, 79, 216, .12); box-shadow: 0 0 10px rgba(255, 79, 216, .45); }
  .vw button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  .vw #todos { border-bottom: 1px solid var(--line); background: var(--panel); }
  .vw #todos .in_progress { color: var(--mint); text-shadow: var(--glow); font-weight: 600; }
  .vw #todos .completed { color: var(--dim); }
  .vw .item { border-bottom: 1px solid var(--line); }
  .vw .k { opacity: 1; text-shadow: var(--glow); font-size: .74em; }
  .vw .title { color: var(--fg); }
  .vw :is(.read, .edit, .search, .hits, .bash) .title { font-size: .92em; }
  .vw .sub { color: var(--dim); opacity: 1; }
  .vw pre.body { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: #d9d2ff; }
  .vw .prompt { background: linear-gradient(90deg, rgba(255, 79, 216, .10), transparent 70%); }
  .vw .prompt .body::before { content: '❯ '; color: var(--pink); text-shadow: var(--glow); }
  .vw .thinking .body { color: var(--dim); }
  .vw a { color: var(--cyan); }
  .vw a:hover { text-shadow: var(--glow); text-decoration: none; }
  .vw .hits a { color: var(--mint); }
  .vw #empty { color: var(--dim); opacity: 1; }
  .vw .prompt .k, .vw .edit .k { color: var(--pink); }
  .vw .text .k, .vw .plan .k { color: var(--violet); }
  .vw .read .k, .vw .agent .k, .vw .web .k { color: var(--cyan); }
  .vw .search .k, .vw .hits .k, .vw .stop .k { color: var(--mint); }
  .vw .bash .k, .vw .wait .k { color: var(--peach); }
  .vw .output .k, .vw .tool .k, .vw .thinking .k { color: var(--dim); text-shadow: none; }
  .vw .fail .k, .vw .fail .title { color: var(--red); }
  /* respiro como no artifact: rótulo, título e detalhe cada um na sua linha */
  .vw { line-height: 1.5; }
  .vw .row { padding: 12px 10px 10px; }
  .vw header::after { content: ''; position: absolute; inset: auto 0 0 0; height: 1px; background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); box-shadow: 0 0 8px var(--pink), 0 0 16px rgba(79, 240, 255, .5); }
  .vw #tabs { padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
  .vw .tab { padding: 4px 9px 7px; }
  .vw .item { padding: 9px 10px; }
  .vw .k { display: block; min-width: 0; margin: 0 0 2px; font-weight: 700; letter-spacing: .06em; }
  .vw .sub { margin-top: 1px; font-size: .85em; }
  .vw .body { margin-top: 6px; }
  .vw #arcade #lv { background: none; box-shadow: none; }
  .vw #pct { color: var(--dim); opacity: 1; }
  .vw #state.edit, .vw #state.prompt { color: var(--pink); }
  .vw #state.search, .vw #state.hits, .vw #state.stop { color: var(--mint); }
  .vw #state.bash, .vw #state.wait { color: var(--peach); }
  .vw #state.text, .vw #state.plan { color: var(--violet); }
  .vw #state.fail { color: var(--red); }
  .vw .item.fail { border-left-color: var(--red); background: rgba(255, 92, 122, .05); }
  .vw details.fold summary { color: var(--cyan); opacity: 1; }
  .vw .diff .add { color: var(--mint); background: rgba(124, 245, 200, .06); }
  .vw .diff .del { color: var(--red); background: rgba(255, 92, 122, .06); }
  .vw .tab .n { color: var(--dim); text-shadow: none; opacity: 1; }
  .vw #arcade { background: var(--bg); border-top-color: var(--line); }
  .vw #abar { color: var(--dim); }
  .vw #abar b { color: #f0d040; }
  .vw #gFoe { color: var(--fg); }
  .vw .lnk, .vw .lnk:hover { border: 0; color: var(--cyan); background: transparent; box-shadow: none; }
  .vw .lnk:hover { text-shadow: var(--glow); }
  .vw .item.fresh { animation: tune-in .5s ease-out; }
  @keyframes tune-in { from { opacity: 0; transform: translateY(4px); background: rgba(79, 240, 255, .08); } }
  @media (prefers-reduced-motion: reduce) { .vw .item.fresh { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <svg id="mascot" viewBox="0 0 128 128" aria-hidden="true">
      <path class="case" d="M50 30 38 10M78 30l12-20"/>
      <rect class="case" x="10" y="30" width="108" height="80" rx="18"/>
      <rect class="screen" x="22" y="42" width="84" height="56" rx="10"/>
      <text id="face" x="64" y="79" text-anchor="middle">T_T</text>
    </svg>
    <span id="state"></span>
    <button id="pause"></button>
  </div>
  <div id="upd-row"><button id="upd" hidden></button></div>
  <nav id="tabs" hidden></nav>
  <div id="toast" role="status" hidden></div>
</header>
<div id="todos" hidden></div>
<div id="empty"></div>
<div id="feed"></div>
<div id="ws" hidden role="button" tabindex="0">
  <div class="ws-top"><span id="wsTitle"></span><span id="wsClock"></span></div>
  <div class="ws-body">
    <div class="ws-now"><div id="wsTemp"></div><div id="wsCond"><span></span><small></small></div></div>
    <div id="wsDays"></div>
  </div>
  <div class="ws-crawl"><span id="wsCrawl"></span></div>
</div>
<footer id="arcade">
  <div class="line" id="level"><span id="lv"><b>LV</b><span id="lvn">1</span></span><div id="xp"><i></i></div><span id="pct"></span></div>
  <div id="strip"><canvas id="game" width="240" height="60" aria-hidden="true"></canvas><div id="gtoast" role="status" hidden></div></div>
  <div id="abar">
    <span class="g"><span id="gCastleL"></span> <b id="gCastle">1</b></span>
    <span class="g" id="gZone"></span>
    <span class="g" id="gPct"></span>
    <span class="g" id="gFoe"></span>
    <button class="lnk" id="hideBtn"></button>
  </div>
</footer>
<script nonce="%NONCE%" src="%GAME%"></script>
<script nonce="%NONCE%">
  const vscode = acquireVsCodeApi();
  const MAX = 400; // mesmo limite do feed na extensão
  let UI = { labels: {}, empty: '', pause: 'Pause', resume: 'Resume' }; // textos chegam da extensão no idioma escolhido
  let isPaused = false;
  let following = 'flow', projects = [];
  const unread = new Set(); // projetos com passo novo que a aba seguida não mostrou
  const LEVELUP_MS = 2600;  // quanto o aviso e a cara de comemoração ficam na tela
  // A cara do mascote acompanha o último passo.
  const FACE = { prompt: '•_•', text: '•‿•', thinking: '-_-', read: 'o_o', search: 'O_O', hits: '^o^', bash: '>_>', output: 'o_o', edit: '>_<', plan: '•_•', agent: '◉_◉', web: 'O_O', wait: '?_?', fail: 'T_T', stop: '^_^', tool: 'o_o' };
  const $ = (id) => document.getElementById(id);
  const feedEl = $('feed'), todosEl = $('todos');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const open = (file, line) => vscode.postMessage({ type: 'open', file, line });

  const FOLD = 12, SHOW = 8; // acima de FOLD linhas, mostra SHOW e recolhe o resto
  function pre(lines, diff) {
    const p = el('pre', diff ? 'body diff' : 'body');
    if (!diff) { p.textContent = lines.join('\n'); return p; }
    lines.forEach((l, i) => p.append(el('span', l.startsWith('+ ') ? 'add' : l.startsWith('- ') ? 'del' : '', l + (i < lines.length - 1 ? '\n' : ''))));
    return p;
  }
  function render(it) {
    const d = el('div', 'item ' + it.kind);
    d.dataset.project = it.project || '';
    const head = el('div');
    if (it.projectName) head.append(el('span', 'proj', it.projectName));
    head.append(el('span', 'k', (it.agent ? 'sub · ' : '') + (UI.labels[it.kind] || it.kind)));
    const title = el(it.file ? 'a' : 'span', 'title', it.title || '');
    if (it.file) title.onclick = () => open(it.file, it.line || 1);
    head.append(title);
    d.append(head);
    if (it.sub) d.append(el('div', 'sub', it.sub));
    if (it.body) {
      const lines = it.body.split('\n');
      if ((it.kind === 'bash' || it.diff) && lines.length > FOLD) { // comando ou edição longa: as primeiras linhas aparecem, o resto abre no clique
        d.append(pre(lines.slice(0, SHOW), it.diff));
        const det = el('details', 'fold');
        det.append(el('summary', '', `+${lines.length - SHOW} ${UI.lines}`), pre(lines.slice(SHOW), it.diff));
        d.append(det);
      } else d.append(it.code ? pre(lines, it.diff) : el('div', 'body', it.body));
    }
    if (it.hits && it.hits.length) {
      const h = el('div', 'hits');
      for (const x of it.hits) {
        const a = el('a', '', `${x.rel}:${x.line}`);
        a.onclick = () => open(x.file, x.line);
        h.append(a);
      }
      d.append(h);
    }
    return d;
  }

  // Só rola sozinho se a pessoa já está no fim; se subiu para reler, não puxa de volta.
  let stick = true;
  addEventListener('scroll', () => { stick = innerHeight + scrollY >= document.body.scrollHeight - 40; });
  const shows = (project) => following === 'flow' || following === (project || '');
  function add(it, fresh) {
    $('empty').hidden = true;
    const d = render(it);
    d.hidden = !shows(it.project);
    if (fresh) d.classList.add('fresh');
    feedEl.append(d);
    while (feedEl.children.length > MAX) feedEl.firstChild.remove();
    if (fresh) { // passo ao vivo (não o replay do init): empurra o jogo e tira a TV do canal de previsão
      game.event(it.kind);
      lastFresh = Date.now(); wsDismissed = false; showWs(false);
      if (d.hidden) unread.add(it.project);
      renderTabs(); // contagem das abas
    }
    if (d.hidden) return;
    $('state').className = it.kind;
    if (stick) scrollTo(0, document.body.scrollHeight);
    if (!celebrating) $('face').textContent = FACE[it.kind] || 'o_o';
  }

  // ---------- abas ----------
  function renderTabs() {
    const nav = $('tabs');
    nav.textContent = '';
    nav.hidden = projects.length === 0;
    document.body.classList.toggle('multi', projects.length > 1);
    document.body.classList.toggle('flow', following === 'flow');
    const count = { flow: feedEl.children.length };
    for (const d of feedEl.children) count[d.dataset.project] = (count[d.dataset.project] || 0) + 1;
    for (const p of [{ key: 'flow', name: UI.flow, tip: UI.flowTip }, ...projects]) {
      const b = el('button', 'tab' + (following === p.key ? ' on' : ''), p.name);
      b.append(el('span', 'n', String(count[p.key] || 0)));
      b.title = p.tip || p.key;
      if (p.key !== 'flow' && unread.has(p.key)) b.append(el('span', 'dot'));
      b.onclick = () => vscode.postMessage({ type: 'follow', project: p.key });
      nav.append(b);
    }
  }
  function setFollowing(f) {
    following = f;
    unread.delete(f);
    if (f === 'flow') unread.clear();
    for (const d of feedEl.children) d.hidden = !shows(d.dataset.project);
    renderTabs();
    scrollTo(0, document.body.scrollHeight);
  }

  // ---------- nível ----------
  let celebrating = false;
  let lastXp = { level: 0, progress: -1 };
  function setXp(x) {
    game.level(x.level);
    $('lvn').textContent = x.level;
    $('pct').textContent = `${Math.floor(x.progress * 100)}%`;
    $('level').title = x.tip;
    $('lv').title = x.tip;
    $('xp').firstElementChild.style.width = `${Math.round(x.progress * 1000) / 10}%`;
    if (x.level === lastXp.level && x.progress > lastXp.progress) { // ganhou XP: reflexo passa na barra
      const b = $('xp');
      b.classList.remove('gain');
      void b.offsetWidth; // reinicia a animação
      b.classList.add('gain');
    }
    lastXp = x;
  }
  function setUpdate(u) {
    const b = $('upd');
    b.hidden = !u;
    if (u) { b.textContent = `${u.kind === 'outdated' ? '⚠' : '★'} ${u.text}`; b.title = u.tip; b.dataset.kind = u.kind; }
  }
  $('upd').addEventListener('click', () => { const k = $('upd').dataset.kind; setUpdate(null); if (k === 'updated') vscode.postMessage({ type: 'ackUpdate' }); });
  function levelUp(level) {
    const t = $('toast');
    t.textContent = `★ ${UI.levelUp} lv ${level}`;
    t.hidden = false;
    celebrating = true;
    $('face').textContent = '★_★';
    document.body.classList.add('levelup');
    setTimeout(() => { t.hidden = true; celebrating = false; document.body.classList.remove('levelup'); }, LEVELUP_MS);
  }
  function showTodos(list) {
    todosEl.textContent = '';
    todosEl.hidden = !list || !list.length;
    const mark = { completed: '✓', in_progress: '▸', pending: '·' };
    for (const t of list || []) todosEl.append(el('div', t.status, `${mark[t.status] || '·'} ${t.content}`));
  }
  const setPaused = (p) => { isPaused = p; $('pause').textContent = p ? UI.resume : UI.pause; };
  function setUi(ui) {
    UI = ui;
    $('empty').textContent = ui.empty;
    setPaused(isPaused);
    renderTabs();
    game.lang(ui.lang);
    if (!$('ws').hidden) renderWs();
  }
  const setSkin = (s) => document.body.classList.toggle('vw', s !== 'vscode');

  // ---------- rodapé e canal de previsão: o feed rola entre o cabeçalho e o rodapé fixo ----------
  function layout() {
    const h = document.querySelector('header').offsetHeight, f = $('arcade').offsetHeight;
    document.body.style.paddingBottom = `${f}px`;
    $('ws').style.top = `${h}px`;
    $('ws').style.bottom = `${f}px`;
  }
  new ResizeObserver(layout).observe(document.querySelector('header'));
  new ResizeObserver(layout).observe($('arcade'));
  window.tv = {
    resize: layout,
    celebrate() { // chefe derrotado no jogo: a TV comemora como no level up, sem o aviso
      if (celebrating) return;
      celebrating = true;
      $('face').textContent = '★_★';
      document.body.classList.add('levelup');
      setTimeout(() => { celebrating = false; document.body.classList.remove('levelup'); }, 1400);
    },
  };

  const IDLE_MS = 120_000; // Claude parado esse tempo: a TV muda para a previsão
  const WS_ICON = { clear: '☀', rain: '☂', snow: '❄', night: '☾', storm: '⚡' };
  let wsData = null, lastFresh = Date.now(), wsDismissed = false;
  const locale = () => (UI.lang === 'pt' ? 'pt-BR' : 'en-US');
  function setWeather(w) {
    wsData = w && w.now ? w : null;
    game.weather(wsData && wsData.now.kind);
    if (!wsData) showWs(false); else if (!$('ws').hidden) renderWs();
  }
  function renderWs() {
    const w = wsData, k = UI.ws;
    if (!w || !k) return;
    $('wsTitle').textContent = k.title;
    $('wsClock').textContent = new Date().toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
    $('wsTemp').textContent = `${w.now.temp}°`;
    $('wsCond').firstElementChild.textContent = k.kinds[w.now.kind];
    $('wsCond').lastElementChild.textContent = w.city;
    const days = $('wsDays');
    days.textContent = '';
    for (const d of w.days) {
      const c = el('div');
      c.append(el('b', '', new Date(`${d.d}T12:00`).toLocaleDateString(locale(), { weekday: 'short' }).replace('.', '').toUpperCase()), el('i', '', WS_ICON[d.kind] || '·'), el('span', '', `${d.max}°`));
      days.append(c);
    }
    $('wsCrawl').textContent = `${k.now}: ${k.kinds[w.now.kind].toLowerCase()}, ${w.now.temp}° · ${w.city} · ${k.back}`;
  }
  function showWs(on) {
    if ($('ws').hidden === !on) return;
    $('ws').hidden = !on;
    if (on) { renderWs(); if (!celebrating) $('face').textContent = '•‿•'; }
  }
  const dismissWs = () => { wsDismissed = true; showWs(false); };
  $('ws').addEventListener('click', dismissWs);
  $('ws').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') dismissWs(); });
  setInterval(() => {
    if (wsData && !wsDismissed && !isPaused && $('ws').hidden && Date.now() - lastFresh > IDLE_MS) showWs(true);
    else if (!$('ws').hidden) $('wsClock').textContent = new Date().toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
  }, 5000);
  game.onSave = (save) => vscode.postMessage({ type: 'game', save });

  addEventListener('message', ({ data: m }) => {
    if (m.type === 'ui') setUi(m.ui);
    if (m.type === 'projects') { projects = m.projects; renderTabs(); }
    if (m.type === 'following') setFollowing(m.following);
    if (m.type === 'update') setUpdate(m.update);
    if (m.type === 'xp') setXp(m.xp);
    if (m.type === 'levelup') levelUp(m.level);
    if (m.type === 'init') {
      game.start(m.game, m.ui.lang);
      following = m.following; projects = m.projects; setXp(m.xp); setUpdate(m.update); setSkin(m.skin); setUi(m.ui);
      feedEl.textContent = ''; m.feed.forEach((it) => add(it, false)); renderTabs();
      showTodos(m.todos); setPaused(m.paused); $('state').textContent = m.state; setWeather(m.weather); layout();
    }
    if (m.type === 'weather') setWeather(m.weather);
    if (m.type === 'add') add(m.item, true);
    if (m.type === 'todos') showTodos(m.todos);
    if (m.type === 'state') $('state').textContent = m.state;
    if (m.type === 'paused') setPaused(m.paused);
    if (m.type === 'skin') setSkin(m.skin);
  });
  $('pause').onclick = () => vscode.postMessage({ type: 'toggle' });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
